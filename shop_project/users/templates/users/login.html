{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h2 class="mb-4">Login</h2>
                <form method="post">
                    {% csrf_token %}
                    {{form.as_p}}
                    <button class="btn btn-success w-100" type="submit">Login</button>
                </form>
                <p class="mt-3 text-center">No account? <a href="{% url 'users:register' %}">Register</a></p>
            </div>
        </div>
    </div>
{% endblock %}
