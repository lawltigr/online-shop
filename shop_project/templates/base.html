{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a href="/" class="navbar-brand fw-bold">Online Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a href="/" class="nav-link">Catalog</a></li>
                    <li class="nav-item"><a href="/cart/" class="nav-link">Cart</a></li>
                    <li class="nav-item"><a href="/dashboard/" class="nav-link">Dashboard</a></li>
                    <li class="nav-item"><a href="/admin/" class="btn btn-outline-light btn-sm">Admin</a></li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a href="{% url 'users:profile' %}">{{user.username}}</a>
                    </li>
                    <li class="nav-item">
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button class="btn tbn-outline-light btn-sm" type="submit">Logout</button>
                        </form>
                    </li>
                    {% else %}
                    <li class="nav-item"><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                    <li class="nav-item"><a href="{% url 'users:register' %}" class="btn btn-primary btn-sm">Register</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
        <!-- <a href="/" style="color: white; margin-right: 15px;">Main Page</a>
        <a href="/admin/" style="color: white;">Admin Panel</a>
        <a href="/dashboard/" style="color: white; margin-left: 15px;">Dashboard</a> -->
    </nav>
    <div style="max-width: 1200px; margin: 20px autpo;">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
